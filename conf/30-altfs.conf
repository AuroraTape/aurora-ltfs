# Aurora LTFS syslog settings (rsyslog)
#
# Route the messages of the Aurora LTFS commands to /var/log/altfs.log with
# RFC 3339 timestamps, and keep them out of the system log, which the
# high-volume output would otherwise flood.
#
# The commands identify themselves to syslog by their program name
# (openlog() in src/cmd/*). This file has to be read before the rules that
# write the system log (50-default.conf on Debian / Ubuntu), hence the 30-
# prefix: "stop" only affects rules that come later.
if ($programname == "altfs" or $programname == "mkaltfs" or
    $programname == "altfsck" or $programname == "altfsindextool") then {
    action(type="omfile" file="/var/log/altfs.log" fileCreateMode="0644"
           template="RSYSLOG_FileFormat")
    stop
}

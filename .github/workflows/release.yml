name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Containers (ubuntu:24.04, rockylinux:9) don't have bash as /bin/sh, so
# GitHub Actions falls back to sh for `run:` steps. Force bash for
# parameter-expansion features like ${GITHUB_SHA:0:7}.
defaults:
  run:
    shell: bash

jobs:
  deb:
    name: Build .deb (Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y \
            build-essential devscripts debhelper dh-autoreconf fakeroot \
            autoconf automake libtool pkg-config \
            libfuse-dev libxml2-dev libicu-dev uuid-dev icu-devtools \
            git ca-certificates

      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version: $V"

      - name: Embed version into configure.ac
        run: |
          sed -i -E "s|^AC_INIT\(.*\)$|AC_INIT([Aurora LTFS], [${VERSION}], [])|" configure.ac
          grep '^AC_INIT' configure.ac

      - name: Rewrite debian/changelog
        env:
          DEBEMAIL: atsushi.abe@turing-motors.com
          DEBFULLNAME: Aurora Tape Project
        run: |
          rm -f debian/changelog
          dch --create --package aurora-ltfs --newversion "${VERSION}" \
              --distribution unstable "Release ${VERSION}"
          dch --release --distribution unstable ""
          cat debian/changelog

      - name: Build source + binary packages
        run: |
          # safe.directory because dpkg-buildpackage may invoke git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p out
          # dpkg-buildpackage drops outputs into the parent directory.
          # Note: Ubuntu still uses the .ddeb extension for -dbgsym packages.
          mv ../aurora-ltfs_${VERSION}* out/ 2>/dev/null || true
          mv ../*.deb out/ 2>/dev/null || true
          mv ../*.ddeb out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: out/

  rpm:
    name: Build .rpm (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install build deps
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y \
            rpm-build rpmdevtools \
            autoconf automake libtool make gcc pkg-config \
            fuse-devel libxml2-devel libicu-devel icu libuuid-devel \
            diffutils redhat-rpm-config annobin gcc-plugin-annobin \
            git ca-certificates

      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version: $V"

      - name: Embed version into configure.ac and spec
        run: |
          sed -i -E "s|^AC_INIT\(.*\)$|AC_INIT([Aurora LTFS], [${VERSION}], [])|" configure.ac
          sed -i -E "s|^Version:.*|Version:        ${VERSION}|" rpm/altfs.spec
          grep '^AC_INIT' configure.ac
          grep '^Version:' rpm/altfs.spec

      - name: Build source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./autogen.sh
          ./configure
          make dist
          ls -la aurora-ltfs-*.tar.gz

      - name: rpmbuild (source + binary)
        run: |
          rpmdev-setuptree
          cp aurora-ltfs-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          cp rpm/altfs.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/altfs.spec

      - name: Collect artifacts
        run: |
          mkdir -p out
          find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -name '*.rpm' -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: out/

  docker:
    name: Build & push container image (GHCR, amd64)
    needs: [deb]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: docker/debs/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately no `latest` tag: a tape-touching tool must never change
      # behavior behind the user's back. Only X.Y.Z / X.Y / X are published.
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: |
          IMG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$IMG" altfs -V
          docker run --rm "$IMG" mkaltfs --help > /dev/null
          docker run --rm "$IMG" altfsck --help > /dev/null
          docker run --rm "$IMG" altfsindextool --help > /dev/null
          # Format a fake tape with the file backend (no device needed)
          docker run --rm "$IMG" bash -c \
            'mkdir -p /tmp/tape && mkaltfs -e file -d /tmp/tape -s SMOKE0 -f -q'

      - name: Push image
        run: |
          echo '${{ steps.meta.outputs.tags }}' | xargs -n1 docker push

  release:
    name: Publish GitHub Release
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release/
          find artifacts/ -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: release/*

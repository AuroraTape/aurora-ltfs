name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            id: ubuntu2404
            pkg: apt
            configure_extra: ""
            install: true
          - name: Rocky Linux 9
            container: rockylinux:9
            id: rocky9
            pkg: dnf
            configure_extra: ""
            install: true
          # Tier 2 platform (issue #73): build verified in CI, failures do
          # not block releases.
          - name: Debian 13
            container: debian:13
            id: debian13
            pkg: apt
            configure_extra: ""
            install: true
          # Compile-only validation that every ltfsmsg(...) call site agrees
          # with the printf format string in the message catalog. With
          # --enable-message-checker the ltfsmsg() macro expands to a raw
          # printf() against the catalog text, so -Wformat catches type
          # mismatches at compile time. The resulting binary is not
          # functional by design (configure help says "may be binary is
          # defunct"), so we skip `make install`.
          - name: Ubuntu 24.04 (message-checker)
            container: ubuntu:24.04
            id: msgcheck
            pkg: apt
            configure_extra: "--enable-message-checker"
            install: false
          # Compile check of the experimental format spec 2.5 support
          # (issue #64) so the FORMAT_SPEC25-gated code does not rot
          # while the default build ships spec 2.4.
          - name: Ubuntu 24.04 (format-spec25)
            container: ubuntu:24.04
            id: spec25
            pkg: apt
            configure_extra: "--enable-format-spec25"
            install: true

    steps:
      - name: Install dependencies (apt)
        if: matrix.pkg == 'apt'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            python3 \
            git \
            ca-certificates

      - name: Install dependencies (dnf)
        if: matrix.pkg == 'dnf'
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            fuse-devel \
            libxml2-devel \
            libicu-devel \
            icu \
            libuuid-devel \
            diffutils \
            redhat-rpm-config \
            annobin \
            gcc-plugin-annobin \
            python3 \
            git \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix="${GITHUB_WORKSPACE}/_install" --enable-warning-as-error ${{ matrix.configure_extra }}

      - name: make
        run: make -k -j"$(nproc)"

      - name: make install
        if: matrix.install
        run: make install

  # Build verification for the non-Linux platforms (issue #73). Tier 2/3
  # platforms, build only — no tape hardware and no FUSE mount in CI, so
  # nothing is executed. --enable-warning-as-error is deliberately not
  # used here: these builds compile with clang or older gcc and warning
  # sets differ from the Tier 1 gcc baseline.
  macos:
    name: macOS 15
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ossp-uuid \
            libxml2 \
            icu4c
          brew install --cask macfuse

      # icu4c and libxml2 are keg-only; macFUSE installs fuse.pc under
      # /usr/local/lib/pkgconfig even on Apple Silicon.
      - name: Set up Homebrew paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: LDFLAGS="-framework CoreFoundation -framework IOKit" ./configure --prefix="${GITHUB_WORKSPACE}/_install"

      - name: make
        run: make -k -j"$(sysctl -n hw.ncpu)"

      - name: make install
        run: make install

  freebsd:
    name: FreeBSD 14.3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y \
              autoconf \
              automake \
              libtool \
              pkgconf \
              gmake \
              fusefs-libs \
              libuuid \
              libxml2 \
              icu
          run: |
            set -e
            ./autogen.sh
            ./configure --prefix=/usr/local --mandir=/usr/local/man
            gmake -k -j"$(sysctl -n hw.ncpu)"
            gmake install

  netbsd:
    name: NetBSD 10.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add \
              autoconf \
              automake \
              libtool-base \
              pkgconf \
              gmake \
              fuse \
              libuuid \
              libxml2 \
              icu
          run: |
            set -e
            ./autogen.sh
            ./configure
            gmake -k -j"$(sysctl -n hw.ncpu)"
            gmake install

  # Per-language LOC table in the job summary (issue #45). tokei.rs (the
  # badge service) is unreliable, so the README carries a code-size badge
  # instead and the detailed numbers live here.
  loc:
    name: Lines of code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Count lines of code
        run: |
          echo '## Lines of code' >> "$GITHUB_STEP_SUMMARY"
          cloc --quiet --md --hide-rate src messages docs >> "$GITHUB_STEP_SUMMARY"

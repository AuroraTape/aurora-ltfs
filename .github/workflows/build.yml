name: Build

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    # Tier 2 entries (experimental: true) never fail the workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            id: ubuntu2404
            pkg: apt
            configure_extra: ""
            install: true
          - name: Rocky Linux 9
            container: rockylinux:9
            id: rocky9
            pkg: dnf
            configure_extra: ""
            install: true
          # Tier 2 platforms (issues #73, #140): build verified in CI,
          # failures do not block releases. Ubuntu 26.04 and Rocky Linux 10
          # are the successors of the Tier 1 releases; they catch toolchain
          # regressions before the Tier 1 move (#80).
          - name: Debian 13
            container: debian:13
            id: debian13
            pkg: apt
            configure_extra: ""
            install: true
            experimental: true
          - name: Ubuntu 26.04
            container: ubuntu:26.04
            id: ubuntu2604
            pkg: apt
            configure_extra: ""
            install: true
            experimental: true
          - name: Rocky Linux 10
            # the official-image repository stops at 9; 10 is published under the org
            container: rockylinux/rockylinux:10
            id: rocky10
            pkg: dnf
            configure_extra: ""
            install: true
            experimental: true
          # Compile-only validation that every ltfsmsg(...) call site agrees
          # with the printf format string in the message catalog. With
          # --enable-message-checker the ltfsmsg() macro expands to a raw
          # printf() against the catalog text, so -Wformat catches type
          # mismatches at compile time. The resulting binary is not
          # functional by design (configure help says "may be binary is
          # defunct"), so we skip `make install`.
          - name: Ubuntu 24.04 (message-checker)
            container: ubuntu:24.04
            id: msgcheck
            pkg: apt
            configure_extra: "--enable-message-checker"
            install: false

    steps:
      - name: Install dependencies (apt)
        if: matrix.pkg == 'apt'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            python3 \
            git \
            ca-certificates

      - name: Install dependencies (dnf)
        if: matrix.pkg == 'dnf'
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            fuse-devel \
            libxml2-devel \
            libicu-devel \
            icu \
            libuuid-devel \
            diffutils \
            redhat-rpm-config \
            gcc-plugin-annobin \
            python3 \
            git \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix="${GITHUB_WORKSPACE}/_install" --enable-warning-as-error ${{ matrix.configure_extra }}

      - name: make
        run: make -k -j"$(nproc)"

      - name: make install
        if: matrix.install
        run: make install

  # Build verification for the non-Linux platforms (issue #73). Tier 2/3
  # platforms: no tape hardware in CI, and no FUSE mount either (the macFUSE
  # kernel extension and the FSKit extension both need an interactive
  # approval an unattended runner cannot give). --enable-warning-as-error is
  # deliberately not used here: these builds compile with clang or older gcc
  # and warning sets differ from the Tier 1 gcc baseline.
  #
  # macOS, FreeBSD and NetBSD additionally run the tests that do not mount
  # (issue #141): the installed mkaltfs / altfsck / altfsindextool / altfs
  # start up through the real plugin loader against the file backend.
  # Non-blocking, as for every Tier 2/3 platform.
  macos:
    name: macOS 15
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ossp-uuid \
            libxml2 \
            icu4c
          brew install --cask macfuse

      # icu4c and libxml2 are keg-only; macFUSE installs fuse.pc under
      # /usr/local/lib/pkgconfig even on Apple Silicon.
      - name: Set up Homebrew paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: LDFLAGS="-framework CoreFoundation -framework IOKit" ./configure --prefix="${GITHUB_WORKSPACE}/_install"

      - name: make
        run: make -k -j"$(sysctl -n hw.ncpu)"

      - name: make install
        run: make install

      # The runner's python3 is Homebrew's and refuses pip installs outside
      # a virtual environment (PEP 668), so pytest goes into one.
      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pytest>=7,<10"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run mount-free tests
        continue-on-error: true
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: bash tests/scenarios/run.sh -v -m "not mount"

  freebsd:
    name: FreeBSD 14.3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y \
              autoconf \
              automake \
              libtool \
              pkgconf \
              gmake \
              fusefs-libs \
              libuuid \
              libxml2 \
              icu \
              python3
            # pytest is a flavored package named after the default python
            # (py311-pytest, py312-pytest, ...): ask the interpreter.
            pyver=$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')
            pkg install -y "py${pyver}-pytest"
            # per-test timeout for the mounted run; optional
            pkg install -y "py${pyver}-pytest-timeout" || true
          # The VM action is one step, so the tests cannot get their own
          # continue-on-error: the "|| echo ::warning::" keeps a test failure
          # visible in the job log and annotations without failing the job.
          run: |
            set -e
            ./autogen.sh
            ./configure --prefix=/usr/local --mandir=/usr/local/man
            gmake -k -j"$(sysctl -n hw.ncpu)"
            gmake install
            export LD_LIBRARY_PATH=/usr/local/lib
            python3 -m pytest tests/scenarios -v -m "not mount" \
              || echo "::warning::mount-free tests failed on FreeBSD 14.3 (Tier 2, non-blocking)"
            # Unlike the hosted macOS runners, the VM has a full kernel and
            # root, so FUSE mounts work: load fusefs and run the mounted
            # tests as well. Exploratory for now - the harness still carries
            # Linux assumptions (os.*xattr, fusermount, mountpoint), so
            # failures are expected and only warn. The timeout bounds a hung
            # mount; the job limit would otherwise be the only stop.
            kldload fusefs || true
            printf '#!/bin/sh\numount "$2"\n' > /usr/local/bin/fusermount
            chmod +x /usr/local/bin/fusermount
            TO=$(python3 -c 'import pytest_timeout' 2>/dev/null && echo "--timeout=120")
            timeout 900 python3 -m pytest tests/fsapi tests/scenarios -v -m mount -rfE $TO \
              || echo "::warning::mounted tests failed on FreeBSD 14.3 (exploratory, non-blocking)"

  netbsd:
    name: NetBSD 10.1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          usesh: true
          prepare: |
            /usr/sbin/pkg_add \
              autoconf \
              automake \
              libtool-base \
              pkgconf \
              gmake \
              fuse \
              libuuid \
              libxml2 \
              icu
            # pkgsrc names pytest after the python it is built for and
            # installs it as pytest-3.NN only; take whichever version the
            # binary repository carries and go through that interpreter.
            for v in 312 313 311; do
              /usr/sbin/pkg_add "python$v" "py$v-test" && break
            done
          # The default prefix is /usr/local, which is on root's PATH in the
          # VM. See the FreeBSD job for the "|| echo".
          run: |
            set -e
            ./autogen.sh
            ./configure
            gmake -k -j"$(sysctl -n hw.ncpu)"
            gmake install
            export PATH=/usr/local/bin:$PATH LD_LIBRARY_PATH=/usr/local/lib
            for PY in /usr/pkg/bin/python3.1?; do
              "$PY" -c 'import pytest' 2>/dev/null && break
            done
            "$PY" -m pytest tests/scenarios -v -m "not mount" \
              || echo "::warning::mount-free tests failed on NetBSD 10.1 (Tier 3, non-blocking)"
            # No mounted tests here. They do run through puffs (librefuse):
            # modload puffs, a fusermount shim, and 106 of the first 110
            # passed - but test_readdir_large_directory and then
            # test_modify_persists_across_remount hung in the kernel,
            # uninterruptible even by pytest-timeout, until the outer
            # timeout. Until the puffs side is understood, only the
            # mount-free tests run on NetBSD.

  # Message catalog consistency: every ID referenced from src/ is defined
  # under messages/ and vice versa. For a pull request into release/X.Y it
  # also checks that added IDs come from that release line's pool or are
  # backports from main (messages/README, "Release-branch ID shapes").
  message-ids:
    name: Message IDs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pool check reads the catalogs of the base branch and main.
          fetch-depth: 0

      - name: Validate message IDs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 validate_error_messages.py \
              --target-branch "$BASE_REF" --base "origin/$BASE_REF"
          else
            python3 validate_error_messages.py
          fi

  # The man pages are generated from man/sgml and the Markdown command
  # reference from the man pages; both are committed. Regenerate them and
  # fail when the committed files differ (the date in .TH aside), so that a
  # change to the SGML cannot leave either behind.
  man-pages:
    name: Man pages and command reference
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install docbook2man and pandoc
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            docbook-utils pandoc git ca-certificates

      - uses: actions/checkout@v4

      - name: Regenerate
        run: |
          cd man
          # From scratch: a page whose SGML source is gone shows up as deleted
          rm -f ./*.8 ./*.1
          for sgml in sgml/*.sgml; do
            docbook2man "$sgml" > /dev/null
          done
          rm -f manpage.*
          cd ..
          man/make-markdown.sh

      - name: Compare with the committed files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A man docs/user/reference
          if ! git diff --cached --exit-code -I '^\.TH ' -- man docs/user/reference; then
            echo "::error::Regenerate the man pages (docbook2man, see man/README.md) and the command reference (man/make-markdown.sh) and commit them"
            exit 1
          fi

  # Per-language LOC table in the job summary (issue #45). tokei.rs (the
  # badge service) is unreliable, so the README carries a code-size badge
  # instead and the detailed numbers live here.
  loc:
    name: Lines of code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc

      - name: Count lines of code
        run: |
          echo '## Lines of code' >> "$GITHUB_STEP_SUMMARY"
          cloc --quiet --md --hide-rate src messages docs >> "$GITHUB_STEP_SUMMARY"

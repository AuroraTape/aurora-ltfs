name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            id: ubuntu2404
            distro: ubuntu
            configure_extra: ""
            install: true
          - name: Rocky Linux 9
            container: rockylinux:9
            id: rocky9
            distro: rocky
            configure_extra: ""
            install: true
          # Compile-only validation that every ltfsmsg(...) call site agrees
          # with the printf format string in the message catalog. With
          # --enable-message-checker the ltfsmsg() macro expands to a raw
          # printf() against the catalog text, so -Wformat catches type
          # mismatches at compile time. The resulting binary is not
          # functional by design (configure help says "may be binary is
          # defunct"), so we skip `make install`.
          - name: Ubuntu 24.04 (message-checker)
            container: ubuntu:24.04
            id: msgcheck
            distro: ubuntu
            configure_extra: "--enable-message-checker"
            install: false

    steps:
      - name: Install dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            python3 \
            git \
            ca-certificates

      - name: Install dependencies (Rocky 9)
        if: matrix.distro == 'rocky'
        run: |
          dnf install -y epel-release
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            fuse-devel \
            libxml2-devel \
            libicu-devel \
            icu \
            libuuid-devel \
            diffutils \
            redhat-rpm-config \
            annobin \
            gcc-plugin-annobin \
            python3 \
            git \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix="${GITHUB_WORKSPACE}/_install" --enable-warning-as-error ${{ matrix.configure_extra }}

      - name: make
        run: make -k -j"$(nproc)"

      - name: make install
        if: matrix.install
        run: make install

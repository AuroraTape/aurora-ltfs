name: Scenario tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: FS API + scenarios (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            fuse \
            python3 \
            python3-pytest \
            git \
            ca-certificates

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix="${GITHUB_WORKSPACE}/_install" --enable-warning-as-error

      - name: make
        run: make -j"$(nproc)"

      - name: make install
        run: make install

      - name: Run FS API tests
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: bash tests/fsapi/run.sh -v

      - name: Run scenario tests
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: bash tests/scenarios/run.sh -v

      # Cross-platform volume check (issue #141): volumes with content can
      # only be written where a FUSE mount is possible. Build them here, check
      # them here first (that keeps the check itself honest), and hand them to
      # the macOS job below. A tarball keeps the zero-length record files and
      # the exact names of the file backend intact.
      - name: Build the volume images
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: |
          export PATH="${ALTFS_PREFIX}/bin:${PATH}"
          export LD_LIBRARY_PATH="${ALTFS_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          # mkaltfs / altfs log every step; keep that out of the job log
          # unless something fails.
          log="${RUNNER_TEMP}/make_images.log"
          python3 tests/xplat/make_images.py --keep-going "${RUNNER_TEMP}/altfs-images" > "$log" 2>&1 \
            || { tail -n 80 "$log"; exit 1; }
          tail -n 1 "$log"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/altfs-volume-images.tgz" altfs-images

      - name: Check the volume images (Linux)
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
          ALTFS_IMAGE_DIR: ${{ runner.temp }}/altfs-images
        run: bash tests/xplat/run.sh -v

      - name: Upload the volume images
        uses: actions/upload-artifact@v4
        with:
          name: altfs-volume-images
          path: ${{ runner.temp }}/altfs-volume-images.tgz
          if-no-files-found: error
          retention-days: 7

  # Read and recover on macOS what Linux wrote (issue #141). The hosted
  # macOS runners cannot mount (macFUSE kext / FSKit need an interactive
  # approval), so this is how the index reader, altfsck's recovery and the
  # file backend see real volume data there. Tier 2: non-blocking.
  #
  # The steps up to "Install pytest" are those of the macos job in
  # build.yml; keep the two in sync (the artifact can only be consumed
  # inside this workflow, hence the second build).
  macos-volume-check:
    name: Volume check (macOS 15)
    runs-on: macos-15
    needs: tests
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ossp-uuid \
            libxml2 \
            icu4c
          brew install --cask macfuse

      # icu4c and libxml2 are keg-only; macFUSE installs fuse.pc under
      # /usr/local/lib/pkgconfig even on Apple Silicon.
      - name: Set up Homebrew paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libxml2)/bin" >> "$GITHUB_PATH"

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: LDFLAGS="-framework CoreFoundation -framework IOKit" ./configure --prefix="${GITHUB_WORKSPACE}/_install"

      - name: make
        run: make -k -j"$(sysctl -n hw.ncpu)"

      - name: make install
        run: make install

      # The runner's python3 is Homebrew's and refuses pip installs outside
      # a virtual environment (PEP 668), so pytest goes into one.
      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pytest>=7,<10"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Download the volume images
        uses: actions/download-artifact@v4
        with:
          name: altfs-volume-images
          path: ${{ runner.temp }}

      - name: Check the volume images (macOS)
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
          ALTFS_IMAGE_DIR: ${{ runner.temp }}/altfs-images
        run: |
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/altfs-volume-images.tgz"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("images written by", m["generator"], "with", m["altfs"])' "${ALTFS_IMAGE_DIR}/manifest.json"
          bash tests/xplat/run.sh -v

  # FreeBSD, both directions (issue #167): the VM has a full kernel, so it
  # can read the Linux-written images *and* write its own through fusefs.
  # Linux then checks the FreeBSD-written ones (job below). Which of the two
  # fails tells whether FreeBSD's index reader / recovery or its writing
  # through fusefs is at fault. Tier 2: non-blocking. The VM step syncs the
  # workspace in and back out, so everything the VM needs or produces lives
  # under the workspace, not RUNNER_TEMP.
  freebsd-volume-check:
    name: Volume check (FreeBSD 14.3)
    runs-on: ubuntu-latest
    needs: tests
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Linux volume images
        uses: actions/download-artifact@v4
        with:
          name: altfs-volume-images
          path: ${{ github.workspace }}/_images-linux

      - name: Check and write volume images in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y \
              autoconf \
              automake \
              libtool \
              pkgconf \
              gmake \
              fusefs-libs \
              libuuid \
              libxml2 \
              icu \
              python3
            pyver=$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')
            pkg install -y "py${pyver}-pytest"
          run: |
            set -e
            ./autogen.sh
            ./configure --prefix=/usr/local --mandir=/usr/local/man
            gmake -k -j"$(sysctl -n hw.ncpu)"
            gmake install
            export LD_LIBRARY_PATH=/usr/local/lib
            # 1. FreeBSD reads what Linux wrote
            tar -C _images-linux -xzf _images-linux/altfs-volume-images.tgz
            ALTFS_IMAGE_DIR="$PWD/_images-linux/altfs-images" python3 -m pytest tests/xplat -v -rfE \
              || echo "::warning::FreeBSD could not check / recover the Linux-written volumes (see #167)"
            # 2. FreeBSD writes its own images through fusefs ...
            kldload fusefs || true
            printf '#!/bin/sh\numount "$2"\n' > /usr/local/bin/fusermount
            chmod +x /usr/local/bin/fusermount
            mkdir -p _images-freebsd
            log=_images-freebsd/make_images.log
            python3 tests/xplat/make_images.py --keep-going _images-freebsd/altfs-images > "$log" 2>&1 \
              || { tail -n 40 "$log"; echo "::warning::not every volume image could be written on FreeBSD"; }
            tail -n 1 "$log"
            tar -C _images-freebsd -czf _images-freebsd/altfs-volume-images-freebsd.tgz altfs-images
            # 3. ... and checks them itself (FreeBSD reads FreeBSD)
            ALTFS_IMAGE_DIR="$PWD/_images-freebsd/altfs-images" python3 -m pytest tests/xplat -v -rfE \
              || echo "::warning::FreeBSD could not check / recover its own volumes (see #167)"
            # 4. Diagnostics for #167: the mounted recovery test fails here
            # although the volumes are fine. Show the fusefs cache mode, the
            # index diff of one case, and the record layout of the original
            # and of the crash copy.
            echo "=== #167 diagnostics"
            sysctl vfs.fusefs.data_cache_mode vfs.fusefs.mmap_enable 2>/dev/null || true
            python3 -m pytest tests/scenarios/test_incindex_recovery.py -k "foundation or clean_recovery" -vv -rfE \
              -o cache_dir=/tmp/pytest-cache --basetemp=/tmp/xp167 || true
            for d in /tmp/xp167/*/tape /tmp/xp167/*/tape-crashed _images-freebsd/altfs-images/crash/foundation/tape; do
              echo "--- $d"; ls -l "$d" | awk '$9 ~ /^1_/ {split($9,a,"_"); printf "#%d %s %s  ", a[2], a[3], $5}' ; echo
            done
            # the index records that differ (ground truth = clean unmount of
            # the original, recovered = partition 0 of the crash copy)
            PYTHONPATH=tests python3 - <<'PYEOF'
            import sys
            from pathlib import Path
            from common.index import index_records, parse_latest_index
            base = Path("/tmp/xp167/test_recovered_tree_matches_mo0")
            truth = index_records(parse_latest_index(base / "tape"))
            for part in (0, 1):
                rec = index_records(parse_latest_index(base / "tape-crashed", part))
                print(f"=== partition {part}: {'equal' if rec == truth else 'DIFFERENT'}")
                for k in sorted(set(truth) | set(rec)):
                    if truth.get(k) != rec.get(k):
                        print(k); print("  truth:", truth.get(k)); print("  recov:", rec.get(k))
            PYEOF

      - name: Upload the FreeBSD volume images
        uses: actions/upload-artifact@v4
        with:
          name: altfs-volume-images-freebsd
          path: ${{ github.workspace }}/_images-freebsd/altfs-volume-images-freebsd.tgz
          if-no-files-found: warn
          retention-days: 7

  # Linux reads what FreeBSD wrote (issue #167).
  linux-check-freebsd-images:
    name: Volume check (Ubuntu 24.04 reads FreeBSD)
    runs-on: ubuntu-24.04
    needs: freebsd-volume-check
    continue-on-error: true
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            fuse \
            python3 \
            python3-pytest \
            git \
            ca-certificates

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix="${GITHUB_WORKSPACE}/_install"

      - name: make
        run: make -j"$(nproc)"

      - name: make install
        run: make install

      - name: Download the FreeBSD volume images
        uses: actions/download-artifact@v4
        with:
          name: altfs-volume-images-freebsd
          path: ${{ runner.temp }}

      - name: Check the FreeBSD volume images (Linux)
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
          ALTFS_IMAGE_DIR: ${{ runner.temp }}/altfs-images
        run: |
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/altfs-volume-images-freebsd.tgz"
          python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print("images written by", m["generator"], "with", m["altfs"], "-", len(m["images"]), "images")' "${ALTFS_IMAGE_DIR}/manifest.json"
          bash tests/xplat/run.sh -v

  coverage:
    name: Coverage (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            gcc \
            pkg-config \
            libfuse-dev \
            libxml2-dev \
            libicu-dev \
            uuid-dev \
            icu-devtools \
            fuse \
            python3 \
            python3-pytest \
            git \
            ca-certificates \
            lcov

      - name: autogen
        run: ./autogen.sh

      # --coverage emits the gcov instrumentation; -O0 / -g keep the
      # mapping back to source lines accurate. --enable-warning-as-error
      # is intentionally dropped here — the instrumentation can introduce
      # warnings that the production build (covered by the tests job
      # above) already gates on.
      #
      # -fprofile-update=atomic: altfs is multithreaded (FUSE workers), and
      # the default non-atomic counter updates race. A lost update can
      # leave a counter negative, which makes geninfo abort with
      # "Unexpected negative count".
      - name: configure (with coverage)
        run: |
          ./configure --prefix="${GITHUB_WORKSPACE}/_install" \
            CFLAGS="-O0 -g --coverage -fprofile-update=atomic" \
            LDFLAGS="--coverage"

      - name: make
        run: make -j"$(nproc)"

      - name: make install
        run: make install

      - name: Run FS API tests
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: bash tests/fsapi/run.sh -v

      - name: Run scenario tests
        env:
          ALTFS_PREFIX: ${{ github.workspace }}/_install
        run: bash tests/scenarios/run.sh -v

      - name: Collect coverage
        run: |
          lcov --capture --directory . --output-file coverage.info \
               --ignore-errors source,gcov
          lcov --remove coverage.info \
               '/usr/*' '*/tests/*' \
               --output-file coverage.info \
               --ignore-errors unused
          lcov --list coverage.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          fail_ci_if_error: false

# Fixes the rootdir at the repository root wherever pytest is started from,
# so tests/conftest.py is always picked up and the marker below is known.
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    mount: the test mounts a volume through FUSE. Deselect with -m "not mount" on a machine that cannot mount (no fusermount, no approved macFUSE), e.g. the macOS CI job.
